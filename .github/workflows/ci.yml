name: Build & Test

on:
  push:
    branches: [main]
    tags-ignore: ['*']   # tags are handled by release.yml
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build ./...
