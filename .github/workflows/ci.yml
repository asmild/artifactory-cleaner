name: Build & Test

on:
  push:
    branches: [main]
    tags-ignore: ['*']   # tags are handled by release.yml
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build ./...   # single compile check, no matrix
